<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Norilight</title>

  <!-- Moonlight's grey ring and white disc: the disc is the seal pup's face -->
  <circle cx="128" cy="128" r="128" fill="rgb(86,92,100)"/>
  <circle cx="128" cy="128" r="96" fill="rgb(255,255,255)"/>

  <!-- Moonlight's eight-point star, same hub and angles as the original.
       The upper three rays are trimmed back to the rim to leave room for the
       eyes; the bottom ray starts below the mouth. -->
  <g stroke="rgb(86,92,100)" stroke-width="8" fill="none">
    <line x1="128" y1="162" x2="128" y2="224"/>
    <line x1="128" y1="32" x2="128" y2="58"/>
    <line x1="60.1" y1="60.1" x2="78.5" y2="78.5"/>
    <line x1="195.9" y1="60.1" x2="177.5" y2="78.5"/>
  </g>

  <!-- The side and lower-diagonal rays are the whiskers: still on the star's
       axes and still reaching the ring, but tapered from the muzzle to a fine
       tip. A shorter loose whisker sits between each pair. -->
  <g fill="rgb(86,92,100)">
    <polygon points="108.0,123.0 31.0,126.4 31.0,129.6 108.0,133.0"/>
    <polygon points="148.0,133.0 225.0,129.6 225.0,126.4 148.0,123.0"/>
    <polygon points="110.3,138.6 58.3,195.5 60.5,197.7 117.4,145.7"/>
    <polygon points="138.6,145.7 195.5,197.7 197.7,195.5 145.7,138.6"/>
    <polygon points="102.7,134.8 53.8,157.9 54.4,159.4 105.3,141.1"/>
    <polygon points="150.7,141.1 201.6,159.4 202.2,157.9 153.3,134.8"/>
  </g>

  <!-- Big, wide-set, glossy eyes -->
  <g fill="rgb(30,32,36)">
    <ellipse cx="80" cy="100" rx="18" ry="20"/>
    <ellipse cx="176" cy="100" rx="18" ry="20"/>
  </g>
  <g fill="rgb(255,255,255)">
    <circle cx="74" cy="92" r="6"/>
    <circle cx="170" cy="92" r="6"/>
    <circle cx="87" cy="108" r="2.6" opacity="0.7"/>
    <circle cx="183" cy="108" r="2.6" opacity="0.7"/>
  </g>

  <!-- Whisker pads over the hub, so the whiskers grow out of them -->
  <g fill="rgb(226,230,235)">
    <ellipse cx="106" cy="140" rx="27" ry="20"/>
    <ellipse cx="150" cy="140" rx="27" ry="20"/>
  </g>
  <path d="M128 132 V146 M128 146 Q120 158 108 153 M128 146 Q136 158 148 153"
        fill="none" stroke="rgb(86,92,100)" stroke-width="5" stroke-linecap="round"/>
  <g fill="rgb(86,92,100)">
    <circle cx="96" cy="134" r="2.4"/>
    <circle cx="106" cy="141" r="2.4"/>
    <circle cx="93" cy="145" r="2.4"/>
    <circle cx="160" cy="134" r="2.4"/>
    <circle cx="150" cy="141" r="2.4"/>
    <circle cx="163" cy="145" r="2.4"/>
  </g>

  <!-- Nose -->
  <path d="M115 117 Q128 112 141 117 Q144 121 137 128 Q128 135 119 128 Q112 121 115 117 Z" fill="rgb(30,32,36)"/>
</svg>
