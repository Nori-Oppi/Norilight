# Norilight nightly builds for Windows (x64 installer and ZIP) and macOS (universal DMG).
#
# Runs every night and publishes the result to the rolling "nightly"
# pre-release, replacing the previous build. Scheduled runs are skipped when
# main hasn't changed since the last nightly, or only its documentation has.
# When CI already built this commit on main (ci.yml), its build is published
# as is instead of compiling the same commit again. Start a run by hand from
# the Actions tab ("Run workflow") to publish even when nothing changed, and
# tick "Build from scratch" to ignore the CI build.
name: Nightly

on:
  schedule:
    # 20:17 Amsterdam time every day, including daylight saving time. Off the hour
    # because GitHub delays or drops scheduled runs most often at :00.
    - cron: '17 20 * * *'
      timezone: 'Europe/Amsterdam'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build from scratch even if CI already built this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
      reuse_run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - name: Skip nights without new code
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Named after the commit's own date, as ci.yml names builds of main
          DATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.committer.date')
          echo "version=nightly-$(date -u -d "${DATE}" +%Y%m%d)-${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

          SHOULD=true
          LAST_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" --jq '.object.sha' 2>/dev/null || true)
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ -n "${LAST_SHA}" ]; then
            if [ "${LAST_SHA}" = "${GITHUB_SHA}" ]; then
              echo "Nightly is already at ${GITHUB_SHA}; nothing to build."
              SHOULD=false
            elif FILES=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${LAST_SHA}...${GITHUB_SHA}" --jq '.files[].filename' 2>/dev/null) \
                && [ -n "${FILES}" ] && [ "$(echo "${FILES}" | wc -l)" -lt 300 ] \
                && ! echo "${FILES}" | grep -qvE '^docs/|\.md$|^LICENSE$'; then
              echo "Only documentation changed since the last nightly (${LAST_SHA:0:7}); nothing to build."
              SHOULD=false
            fi
          fi
          echo "should_publish=${SHOULD}" >> "${GITHUB_OUTPUT}"

      - name: Find a CI build of this commit
        id: reuse
        if: steps.check.outputs.should_publish == 'true' && !inputs.force_build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # The newest successful push build of this exact commit on main whose
          # Windows and macOS artifacts both still exist
          for RUN in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=success&per_page=5" --jq '.workflow_runs[].id'); do
            FOUND=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts" \
              --jq "[.artifacts[] | select(.expired == false) | .name] | map(select(. == \"Norilight-Windows-x64-${VERSION}\" or . == \"Norilight-macOS-${VERSION}\")) | length")
            if [ "${FOUND}" = "2" ]; then
              echo "Publishing CI run ${RUN} instead of building again."
              echo "run_id=${RUN}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "No usable CI build of ${GITHUB_SHA}; building it here."

  build:
    needs: check
    if: needs.check.outputs.should_publish == 'true' && needs.check.outputs.reuse_run_id == ''
    uses: ./.github/workflows/norilight-build.yml
    with:
      version: ${{ needs.check.outputs.version }}
      build_sha: ${{ github.sha }}
      save_caches: ${{ github.ref == 'refs/heads/main' }}
      # The builds live on in the release; the artifacts only carry them there
      artifact_retention_days: 3

  publish:
    needs: [check, build]
    # Runs from other branches (to test this workflow) build but never replace the release
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.check.outputs.should_publish == 'true' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.check.outputs.reuse_run_id != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download builds
        uses: actions/download-artifact@v6
        with:
          path: out
          pattern: Norilight-*-${{ needs.check.outputs.version }}
          merge-multiple: true
          run-id: ${{ needs.check.outputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -la out
          gh release delete nightly --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
          gh release create nightly out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Nightly (${VERSION})" \
            --notes "Automatic build of main at ${GITHUB_SHA}, made $(date -u '+%Y-%m-%d %H:%M UTC').

          These builds are untested and unsigned.
          - **Windows:** download and run the **Setup.exe** for a regular installation with shortcuts and an uninstaller. To run without installing, download the ZIP, extract it and run Norilight.exe.
          - **macOS:** open the DMG and drag Norilight to Applications. The first time, right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/Norilight.app\`. Allow the Local Network prompt; if your PC isn't found, turn Norilight on under System Settings → Privacy & Security → Local Network."
