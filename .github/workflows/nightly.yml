---
# Norilight nightly builds for Windows (x64 installer and ZIP) and macOS (universal DMG).
#
# Runs every night and publishes the result to the rolling "nightly"
# pre-release, replacing the previous build. Nights without new commits on
# main are skipped. Start a build by hand from the Actions tab
# ("Run workflow") to build even when nothing changed.
name: Nightly

on:
  schedule:
    # 20:00 Amsterdam time every day, including daylight saving time.
    - cron: '0 20 * * *'
      timezone: 'Europe/Amsterdam'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.3
  # Same aqtinstall revision upstream Moonlight uses; it understands Qt 6.11's archive layout
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Skip nights without new commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" --jq '.object.sha' 2>/dev/null || true)
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${LAST_SHA}" = "${GITHUB_SHA}" ]; then
            echo "Nightly is already at ${GITHUB_SHA}; nothing to build."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=nightly-$(date -u +%Y%m%d)-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_OUTPUT}"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows-x64
            qt_dir: msvc2022_64
          - os: macos-26
            name: macOS
            qt_dir: macos

    runs-on: ${{ matrix.os }}
    env:
      CI_VERSION: ${{ needs.check.outputs.version }}
      # Lets the app compare itself against the latest nightly (see autoupdatechecker.cpp)
      NORILIGHT_BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      # Qt is cached directly: on a hit the install action is skipped entirely,
      # which avoids a minute of Python package setup that it runs even when
      # its own cache hits.
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.workspace }}/Qt
          key: qt-${{ matrix.os }}-${{ env.QT_VERSION }}

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          cache: false
          set-env: false
          dir: ${{ runner.workspace }}
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Set Qt environment
        shell: pwsh
        run: |
          # Resolve-Path fails the step if Qt is not where it is expected
          $qt = (Resolve-Path (Join-Path $env:RUNNER_WORKSPACE "Qt/$env:QT_VERSION/${{ matrix.qt_dir }}")).Path
          if (!(Get-Command (Join-Path $qt 'bin/qmake') -ErrorAction SilentlyContinue)) { throw "qmake not found in $qt" }
          "QT_ROOT_DIR=$qt" >> $env:GITHUB_ENV
          (Join-Path $qt 'bin') >> $env:GITHUB_PATH

      # Windows ------------------------------------------------------------

      - name: Download dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup-deps.ps1

      # jom builds in parallel where nmake is serial. The build script falls
      # back to nmake if the download fails.
      - name: Install jom (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          curl.exe -s -L -f --retry 2 -o "$env:RUNNER_TEMP\jom.zip" https://download.qt.io/official_releases/jom/jom.zip
          if ($LASTEXITCODE -ne 0) { throw "jom download failed ($LASTEXITCODE)" }
          Expand-Archive -Path "$env:RUNNER_TEMP\jom.zip" -DestinationPath "$env:RUNNER_TEMP\jom" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\jom"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "QT_DIR=%QT_ROOT_DIR%"
          scripts\build-norilight.bat release

      - name: Package ZIP and installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build\Norilight-x64-release\* -DestinationPath "out\Norilight-Windows-x64-$env:CI_VERSION.zip"
          # Inno Setup is preinstalled on the windows-2025 runner.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 compiler not found: $iscc" }
          & $iscc "/DPayloadDir=$env:GITHUB_WORKSPACE\build\Norilight-x64-release" "/DBuildVersion=$env:CI_VERSION" "/DOutputDir=$env:GITHUB_WORKSPACE\out" scripts\norilight-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed ($LASTEXITCODE)" }
          if (!(Test-Path "out\Norilight-Windows-x64-$env:CI_VERSION-Setup.exe")) { throw "Windows installer was not created" }

      - name: Verify Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Resolve-Path "out\Norilight-Windows-x64-$env:CI_VERSION-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'Norilight-install-test'
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8B45E372-762F-4BF8-9B49-8363BD838E65}_is1'
          # Installing twice exercises replacement of an existing nightly installation.
          foreach ($attempt in 1..2) {
            $log = Join-Path $env:RUNNER_TEMP "Norilight-install-$attempt.log"
            $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"", "/LOG=`"$log`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { Get-Content $log; throw "Installer failed ($($process.ExitCode))" }
            foreach ($file in @('Norilight.exe', 'Qt6Core.dll', 'gamecontrollerdb.txt', 'unins000.exe')) {
              if (!(Test-Path (Join-Path $installDir $file))) { throw "Installed file missing: $file" }
            }
            if (Test-Path (Join-Path $installDir 'portable.dat')) { throw 'Installed build must not use portable settings' }
            $registration = Get-ItemProperty $uninstallKey -ErrorAction Stop
            if ($registration.DisplayName -notlike 'Norilight*') { throw 'Norilight uninstall registration missing' }
            if (!(Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Norilight.lnk")) { throw 'Start menu shortcut missing' }
          }
          $log = Join-Path $env:RUNNER_TEMP 'Norilight-uninstall.log'
          $process = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $log; throw "Uninstaller failed ($($process.ExitCode))" }
          if (Test-Path (Join-Path $installDir 'Norilight.exe')) { throw 'Uninstall left the application installed' }
          if (Test-Path $uninstallKey) { throw 'Uninstall left the registration behind' }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Norilight.lnk") { throw 'Uninstall left the Start menu shortcut behind' }

      # macOS --------------------------------------------------------------

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install ccache
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_MAXSIZE=400M" >> "${GITHUB_ENV}"

      # Each commit saves its own compiler cache and starts from the newest earlier one.
      - name: Restore compiler cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.os }}-${{ env.QT_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ env.QT_VERSION }}-

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        env:
          # Nightlies trade link-time optimisation and the styled DMG window for speed
          USE_CCACHE: 1
          DISABLE_LTO: 1
          PLAIN_DMG: 1
        run: |
          ccache --zero-stats
          bash scripts/generate-dmg.sh Release
          ccache --show-stats
          mkdir -p out
          cp build/installer-Release/*.dmg out/
          mkdir -p out
          cp build/installer-Release/*.dmg out/

      # --------------------------------------------------------------------

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: Norilight-${{ matrix.name }}-${{ env.CI_VERSION }}
          path: out/*
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [check, build]
    # Runs from other branches (to test this workflow) build but never replace the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v6
        with:
          path: out
          merge-multiple: true

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -la out
          gh release delete nightly --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
          gh release create nightly out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Nightly (${VERSION})" \
            --notes "Automatic build of main at ${GITHUB_SHA}, made $(date -u '+%Y-%m-%d %H:%M UTC').

          These builds are untested and unsigned.
          - **Windows:** download and run the **Setup.exe** for a regular installation with shortcuts and an uninstaller. To run without installing, download the ZIP, extract it and run Norilight.exe.
          - **macOS:** open the DMG and drag Norilight to Applications. The first time, right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/Norilight.app\`. Allow the Local Network prompt; if your PC isn't found, turn Norilight on under System Settings → Privacy & Security → Local Network."
